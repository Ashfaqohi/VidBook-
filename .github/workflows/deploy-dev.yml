name: CD - deploy development

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deploy
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger Render API development deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_API_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK"
      - name: Trigger Render frontend development deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_FRONTEND_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK"
