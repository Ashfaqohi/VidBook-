name: Roll back Render production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Known-good Git commit SHA to restore"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll back Render API
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PROD_API_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ inputs.version }}
        run: curl --fail-with-body --silent --show-error --request POST "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"
      - name: Roll back Render frontend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PROD_FRONTEND_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ inputs.version }}
        run: curl --fail-with-body --silent --show-error --request POST "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"
