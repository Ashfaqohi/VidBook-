services:
  api:
    image: ${VIDBOOK_IMAGE_NAMESPACE:?Set VIDBOOK_IMAGE_NAMESPACE}/vidbook-api:${VIDBOOK_VERSION:-latest}
    environment:
      VIDBOOK_ENVIRONMENT: production
      VIDBOOK_DB_PATH: /data/vidbook.db
      VIDBOOK_STORAGE_PATH: /data/projects
      VIDBOOK_API_TOKEN: ${VIDBOOK_API_TOKEN:?Set VIDBOOK_API_TOKEN}
      VIDBOOK_CORS_ORIGINS: ${VIDBOOK_CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    volumes:
      - vidbook-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ${VIDBOOK_IMAGE_NAMESPACE:?Set VIDBOOK_IMAGE_NAMESPACE}/vidbook-frontend:${VIDBOOK_VERSION:-latest}
    environment:
      VIDBOOK_API_HOSTPORT: api:8000
    ports:
      - "${VIDBOOK_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vidbook-data:
